<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c20" />
      <stop offset="100%" stop-color="#181530" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="6"/>

  <!-- Glowing background ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#accentGrad)" stroke-width="12" opacity="0.35" filter="url(#glow)"/>

  <!-- Stylized TV Frame + Play Symbol -->
  <rect x="126" y="146" width="260" height="190" rx="28" fill="rgba(255,255,255,0.04)" stroke="url(#accentGrad)" stroke-width="14"/>
  
  <!-- Play Button Arrow -->
  <path d="M226 196 L316 241 C324 245 324 257 316 261 L226 306 C216 311 206 304 206 291 L206 211 C206 198 216 191 226 196 Z" fill="url(#accentGrad)" filter="url(#glow)"/>

  <!-- Antenna / Elephant Ear Arc Accents -->
  <path d="M186 120 Q 256 70 326 120" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round"/>
</svg>
